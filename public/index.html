<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vault</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%237c5cff'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="app">
  <!-- ЛЕВАЯ ПАНЕЛЬ -->
  <aside id="left">
    <div class="left-head">
      <button class="icon-btn" id="btn-home" title="Индекс памяти (MEMORY.md)">⌂</button>
      <input id="filter" type="search" placeholder="Фильтр по имени…  (Ctrl+K — поиск везде)" autocomplete="off">
      <button class="icon-btn" id="btn-new" title="Новая заметка (Ctrl+N)">＋</button>
    </div>
    <div class="left-tabs">
      <button data-view="tree" class="active">Папки</button>
      <button data-view="recent">Свежее</button>
      <button data-view="pins">Закладки</button>
      <button data-view="facts">Факты</button>
      <button data-view="issues">Проблемы</button>
    </div>
    <div id="left-body"></div>
    <div class="left-foot">
      <span id="stat"></span>
      <button class="icon-btn" id="btn-graph" title="Граф связей (Ctrl+G)">◎</button>
      <button class="icon-btn" id="btn-theme" title="Тема">◐</button>
    </div>
  </aside>

  <!-- ЦЕНТР -->
  <main id="center">
    <div id="topbar">
      <div class="crumbs" id="crumbs"></div>
      <div class="actions">
        <button id="btn-mode-read" class="seg active" title="Читать">Читать</button>
        <button id="btn-mode-edit" class="seg" title="Править (Ctrl+E)">Править</button>
        <button id="btn-save" class="primary" hidden title="Сохранить (Ctrl+S)">Сохранить</button>
        <button id="btn-pin" class="icon-btn" title="В закладки">☆</button>
        <button id="btn-more" class="icon-btn" title="Ещё">⋯</button>
      </div>
    </div>
    <div id="content"></div>
  </main>

  <!-- ПРАВАЯ ПАНЕЛЬ -->
  <aside id="right">
    <div class="right-tabs">
      <button data-rv="outline" class="active">Оглавление</button>
      <button data-rv="links">Связи</button>
      <button data-rv="local">Граф</button>
    </div>
    <div id="right-body"></div>
  </aside>
</div>

<!-- Command palette / поиск -->
<div id="palette" class="modal" hidden>
  <div class="modal-box">
    <input id="palette-input" type="text" placeholder="Искать по всей памяти… (Esc — закрыть)" autocomplete="off">
    <div id="palette-results"></div>
  </div>
</div>

<!-- Граф -->
<div id="graph" class="modal" hidden>
  <div class="graph-box">
    <div class="graph-head">
      <span>Граф связей</span>
      <input id="graph-filter" type="search" placeholder="подсветить…">
      <label><input type="checkbox" id="graph-orphans" checked> одиночки</label>
      <button class="icon-btn" id="graph-close">✕</button>
    </div>
    <canvas id="graph-canvas"></canvas>
    <div class="graph-legend" id="graph-legend"></div>
  </div>
</div>

<div id="toast" hidden></div>

<script src="/marked.js"></script>
<script src="/app.js"></script>
<script src="/facts.js"></script>
</body>
</html>
